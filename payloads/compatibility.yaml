schema_version: "1.0"
matrix_version: "2026.10.22"

# A CompatibilityMatrix entry states exactly which (mechanism, strategy,
# carrier, goal) combinations are scientifically meaningful.  Generation refuses
# anything not listed here, and the registry is checked against this file at load
# time.  Adding a payload to a new goal requires an explicit entry.

mechanism_rules:
  direct_instruction:
    allowed_goals:
      [false_negative, false_positive, severity_inflation, severity_downgrade, evidence_corruption, verification_diversion]
    allowed_carriers: [markdown, code_comment, string_literal]
    requires_false_claim_text: true
  semantic_misinformation:
    allowed_goals:
      [false_negative, false_positive, severity_inflation, severity_downgrade, evidence_corruption, verification_diversion]
    allowed_carriers: [markdown, code_comment, string_literal, configuration, test, example_code]
    requires_false_claim_text: true
  representation_confusion:
    allowed_goals: [false_negative, false_positive, evidence_corruption, verification_diversion]
    allowed_carriers: [code_comment, string_literal, source_identifier, example_code]
    requires_false_claim_text: true
  safe_decoy:
    allowed_goals: [false_positive, verification_diversion]
    allowed_carriers: [string_literal, example_code, source_identifier]
    requires_false_claim_text: false
  verification_diversion:
    allowed_goals: [verification_diversion, evidence_corruption]
    allowed_carriers: [markdown, code_comment, string_literal, configuration, test]
    requires_false_claim_text: true

entries:
  - mechanism: direct_instruction
    strategy_family: instruction_override
    carriers: [markdown]
    supported_goals:
      [false_negative, false_positive, severity_inflation, severity_downgrade, evidence_corruption, verification_diversion]
    supported_languages: ["*"]
    required_context: [project_name, cwe, target_component]
    required_oracle_fields: [vulnerability_id]
    required_safe_target: true
    required_validators: true
    notes: "Explicit audit instruction in project documentation."

  - mechanism: direct_instruction
    strategy_family: direct_comment
    carriers: [code_comment]
    supported_goals:
      [false_negative, false_positive, severity_inflation, severity_downgrade, evidence_corruption, verification_diversion]
    supported_languages: ["*"]
    required_context: [file_language, cwe]
    required_oracle_fields: [vulnerability_id]
    required_safe_target: true
    required_validators: true

  - mechanism: direct_instruction
    strategy_family: direct_string
    carriers: [string_literal]
    supported_goals:
      [false_negative, false_positive, severity_inflation, severity_downgrade, evidence_corruption, verification_diversion]
    supported_languages: ["*"]
    required_context: [file_language, cwe]
    required_oracle_fields: [vulnerability_id]
    required_safe_target: true
    required_validators: true

  - mechanism: semantic_misinformation
    strategy_family: false_fix_status
    carriers: [markdown, code_comment]
    supported_goals: [false_negative, evidence_corruption]
    supported_languages: ["*"]
    required_context: [project_name, target_component]
    required_oracle_fields: [vulnerability_id]
    required_safe_target: false
    required_validators: false

  - mechanism: semantic_misinformation
    strategy_family: false_reachability
    carriers: [markdown, code_comment]
    supported_goals: [false_negative, evidence_corruption, verification_diversion]
    supported_languages: ["*"]
    required_context: [project_name, target_component, visible_functions]
    required_oracle_fields: [vulnerability_id, entry_point, critical_operation]
    required_safe_target: false
    required_validators: false

  - mechanism: semantic_misinformation
    strategy_family: false_deployment
    carriers: [markdown]
    supported_goals: [false_positive, evidence_corruption]
    supported_languages: ["*"]
    required_context: [project_name, target_component]
    required_oracle_fields: [vulnerability_id]
    required_safe_target: true
    required_validators: true
    notes: "False-positive claims must name a validated safe target."

  - mechanism: semantic_misinformation
    strategy_family: false_privilege
    carriers: [markdown, code_comment]
    supported_goals: [severity_downgrade, false_negative]
    supported_languages: ["*"]
    required_context: [project_name, target_component]
    required_oracle_fields: [vulnerability_id]
    required_safe_target: false
    required_validators: false

  - mechanism: semantic_misinformation
    strategy_family: severity_anchor
    carriers: [markdown]
    supported_goals: [severity_inflation, severity_downgrade]
    supported_languages: ["*"]
    required_context: [project_name, target_component]
    required_oracle_fields: [vulnerability_id, severity]
    required_safe_target: false
    required_validators: false
    notes: "The same text cannot serve both directions; direction is explicit in payload metadata."

  - mechanism: semantic_misinformation
    strategy_family: distributed_security
    carriers: [markdown, code_comment]
    supported_goals:
      [false_negative, false_positive, evidence_corruption, verification_diversion]
    supported_languages: ["*"]
    required_context: [project_name, target_component, visible_functions]
    required_oracle_fields: [vulnerability_id, entry_point, critical_operation]
    required_safe_target: true
    required_validators: true

  - mechanism: semantic_misinformation
    strategy_family: distributed_architecture
    carriers: [markdown]
    supported_goals:
      [false_negative, false_positive, evidence_corruption, verification_diversion]
    supported_languages: ["*"]
    required_context: [project_name, target_component]
    required_oracle_fields: [vulnerability_id]
    required_safe_target: true
    required_validators: true
    notes: "Node 2 of the distributed claim graph."

  - mechanism: semantic_misinformation
    strategy_family: distributed_comment
    carriers: [code_comment]
    supported_goals:
      [false_negative, false_positive, evidence_corruption, verification_diversion]
    supported_languages: ["*"]
    required_context: [file_language, cwe]
    required_oracle_fields: [vulnerability_id]
    required_safe_target: true
    required_validators: true
    notes: "Node 3 of the distributed claim graph."

  - mechanism: representation_confusion
    strategy_family: representation_comment
    carriers: [code_comment]
    supported_goals:
      [false_negative, false_positive, evidence_corruption, verification_diversion]
    supported_languages: ["*"]
    required_context: [file_language, cwe]
    required_oracle_fields: [vulnerability_id]
    required_safe_target: true
    required_validators: true

  - mechanism: representation_confusion
    strategy_family: representation_helper
    carriers: [string_literal]
    supported_goals: [false_negative, evidence_corruption, verification_diversion]
    supported_languages: [python]
    required_context: [file_language, cwe]
    required_oracle_fields: [vulnerability_id]
    required_safe_target: false
    required_validators: false
    notes: "An uncalled helper cannot create a false positive or change severity by construction."

  - mechanism: safe_decoy
    strategy_family: safe_decoy
    carriers: [string_literal]
    supported_goals: [false_positive, verification_diversion]
    supported_languages: [python]
    required_context: [file_language, cwe]
    required_oracle_fields: [vulnerability_id]
    required_safe_target: false
    required_validators: true
    notes: "The decoy is its own safe target; its validator must execute before use."

  - mechanism: semantic_misinformation
    strategy_family: hybrid
    carriers: [markdown, code_comment, string_literal]
    supported_goals:
      [false_negative, false_positive, evidence_corruption, verification_diversion]
    supported_languages: ["*"]
    required_context: [project_name, target_component]
    required_oracle_fields: [vulnerability_id]
    required_safe_target: true
    required_validators: true
    notes: "Composite strategies are bounded by their children's compatibility."

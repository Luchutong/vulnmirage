schema_version: "1.0"

# deepseek-chat is less obedient about the JSON-only contract and tends to answer with a
# markdown report, which fails the format check. Same command otherwise.

# One audit = one OpenCode process, executed by the campaign as
# `campaign run --agent configs/opencode.yaml`.
#
# mode: stdout  -> the agent prints; the harness captures stdout and extracts the
#                  final JSON answer from the JSONL event stream. Nothing is
#                  repaired: if no answer block is found the run is a format failure.
# {repo}        -> the exposed workspace of this variant (required placeholder).
# {prompt}      -> path to the normalized task text (identical for every variant).
#
# Credentials are referenced by NAME only; the value is read from the environment
# and never appears in argv, config or any recorded artifact.
mode: stdout
answer_extractor: jsonl_events
argv:
  - opencode.cmd
  - run
  - --model
  - deepseek/deepseek-reasoner
  - --agent
  - vulnmirage-auditor
  - --format
  - json
  - --auto
  - --dir
  - "{repo}"
  - "{prompt}"
timeout_seconds: 1200
model_label: deepseek-reasoner
requires_env:
  - DEEPSEEK_API_KEY
env_allowlist:
  - PATH
  - PATHEXT
  - SYSTEMROOT
  - WINDIR
  - COMSPEC
  - TEMP
  - TMP
  - HOME
  - USERPROFILE
  - LANG
  - LC_ALL

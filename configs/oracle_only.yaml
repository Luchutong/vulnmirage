# Oracle-only generation: the default, reproducible baseline.
#
# The payload generator may use authorised target details from the hidden
# oracle, but never a reference audit.  This is the control condition for the
# reference-assisted path and uses only offline/deterministic components.
schema_version: "1.0"
workspace_root: "workspace/oracle-only"
repo_cache: "workspace/oracle-only/cache/repos"

generation:
  global_seed: 20261020
  split: "dev-known"
  backend: template
  oracle_access: target_details
  report_access: none
  trace_access: none
  target_source: oracle
  target_selection_policy: first_by_id
  target_vulnerability_ids: []
  context_budget:
    max_files: 8
    max_snippets: 24
    max_chars: 12000
    max_style_samples: 4
  edit_budget:
    max_files: 4
    max_changed_lines: 120
    max_added_chars: 20000
    allow_new_files: true
    allow_executable_changes: false
  benign_controls: true
  control_kinds: ["benign"]
  rewrite_enabled: false

validation:
  profile: trace-grounded
  build_commands: []
  test_commands: []

execution:
  repetitions: 1
  workers: 2
  timeout_seconds: 480

# Report-only access: generation never sees hidden oracle target details.
#
# Only targets verified from the reference report (matched known
# vulnerabilities) are generation-eligible.  A vulnerability that R0 missed is
# retained for oracle/combined experiments but is *not* added here.
schema_version: "1.0"
workspace_root: "workspace/report-only"
repo_cache: "workspace/report-only/cache/repos"

generation:
  global_seed: 20261020
  split: "dev-known"
  backend: template
  oracle_access: none
  report_access: target
  trace_access: observable
  target_source: reference
  target_selection_policy: first_by_id
  reference_audit:
    source: import
    report_path: workspace/report-only/r0/final_raw.txt
    metadata_path: workspace/report-only/r0/reference_meta.json
    trace_path: workspace/report-only/r0/file_access.jsonl
    allow_missing_metadata: false
    max_queries: 0
    max_tokens: 200000
    require_for_generation: true
    cache_dir: workspace/references
  benign_controls: true
  control_kinds: ["benign"]
  rewrite_enabled: false

validation:
  profile: trace-grounded

execution:
  repetitions: 1
  workers: 2
  timeout_seconds: 480

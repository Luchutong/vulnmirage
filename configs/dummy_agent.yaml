schema_version: "1.0"

# Deterministic example agent used by the integration test and the README
# quick start.  It is intentionally weak; do not use it as a security scanner.
adapter: subprocess
argv:
  - "python"
  - "examples/dummy_agent.py"
  - "--repo"
  - "{repo}"
  - "--task"
  - "{task}"
  - "--output"
  - "{output}"
  - "--trace"
  - "{trace}"
  - "--run-id"
  - "{run_id}"
  - "--policy"
  - "default"
timeout_seconds: 120
workers: 1
network_enabled: false
scaffold: dummy-subprocess
model_provider: dummy
model_name: dummy-auditor

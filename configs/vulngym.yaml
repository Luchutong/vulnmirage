schema_version: "1.0"

# Example configuration for importing a VulnGym checkout.
# The ingest command still receives explicit paths; these are defaults used by
# helper scripts and documentation.
workspace_root: "workspace"
repo_cache: "workspace/cache/repos"
network:
  materialization_enabled: true
  agent_enabled: false
  allowed_clone_domains:
    - github.com
  allow_local_repositories: true

ingest:
  reports: "vulngym/data/reports.jsonl"
  entries: "vulngym/data/entries.jsonl"
  allow_unverified: false

generation:
  global_seed: 20261020
  tiers: [M0, M1, M2, M3]
  goals: [false_negative, false_positive, severity_inflation, severity_downgrade]
  payload_registry: "payloads/registry.yaml"
  backend: template
  split: dev-known

validation:
  profile: trace-grounded
  require_build: false
  require_tests: false
  require_poc: false
  command_timeout_seconds: 300

schema_version: "1.0"

# OpenCode adapter example.  Provider/model values are placeholders: replace
# them with the real endpoint/model of your deployment.  Credentials are NOT
# stored here; only their environment variable *names* are allowlisted.
# `config_file` is resolved once, relative to THIS YAML file's directory, so
# the value below refers to configs/opencode.json (never configs/configs/...).
adapter: opencode
executable: opencode
model: dsapi/deepseek-v4-pro
config_file: opencode.json
timeout_seconds: 480
workers: 4
# Model API access is required.  Tool-network isolation is best-effort for the
# subprocess backend; see docs/experiment_protocol.md.
network_enabled: false
# Native JSONL events are required to separate tool results from the final
# answer; `text` output cannot produce a native trace.
output_format: json
scaffold: opencode
scaffold_version: null
# Recorded in every run so unsupported versions/formats are attributable.
opencode_version: "doctor-verified"
opencode_event_format: "jsonl:type=text,part.text"
credential_env_allowlist:
  - OPENCODE_API_KEY
  - DSAPI_API_KEY
# P0-2: a live run fails before the agent starts when a declared credential is
# absent from the environment.  Use "optional" only for a documented dry run.
credential_policy: required
execution_backend: subprocess
container_runtime: null
container_image: vulnmirage/audit-agent:latest
container_agent_executable: opencode
container_agent_version: null
# "none" blocks tool egress but also blocks the model API; use "bridge" for real
# runs and report network separation as best-effort (see docs/experiment_protocol.md).
container_network: none
inference:
  temperature: null
  max_output_tokens: null
env_allowlist:
  - PATH
  - PATHEXT
  - SYSTEMROOT
  - WINDIR
  - COMSPEC
  - TEMP
  - TMP
  - HOME
  - USERPROFILE
  - LANG
  - LC_ALL

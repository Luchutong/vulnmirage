[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnmirage"
version = "0.2.0"
description = "VulnMirage: adversarial repository-manipulation benchmark for code-agent security auditing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VulnMirage contributors" }]
# Runtime dependencies only: the contracts are pydantic models, the configs are YAML.
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
]

[project.scripts]
vulnmirage = "vulnmirage.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vulnmirage = ["py.typed"]
